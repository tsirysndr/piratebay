on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload assets for (e.g. v0.3.0). The tag and matching GitHub release must already exist."
        required: true
        type: string

jobs:
  release:
    name: release ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            archive: zip
          - target: x86_64-unknown-linux-musl
            archive: tar.gz tar.xz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Compile and release
        if: github.event_name == 'release'
        uses: rust-build/rust-build.action@v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          RUSTTARGET: ${{ matrix.target }}
          ARCHIVE_TYPES: ${{ matrix.archive }}
          TOOLCHAIN_VERSION: stable
      - name: Clean up
        run: sudo rm -rf target
      - name: Installing Rust toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          override: true
      - name: Running cargo build
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu
      - name: Set env
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "RELEASE_VERSION=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          fi
      - name: Packaging final binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czvf piratebay_${{ env.RELEASE_VERSION }}_x86_64-unknown-linux-gnu.tar.gz piratebay
          shasum -a 512 piratebay_${{ env.RELEASE_VERSION }}_x86_64-unknown-linux-gnu.tar.gz > piratebay_${{ env.RELEASE_VERSION }}_x86_64-unknown-linux-gnu.tar.gz.sha512
      - name: Releasing assets
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            target/x86_64-unknown-linux-gnu/release/piratebay_${{ env.RELEASE_VERSION }}_x86_64-unknown-linux-gnu.tar.gz
            target/x86_64-unknown-linux-gnu/release/piratebay_${{ env.RELEASE_VERSION }}_x86_64-unknown-linux-gnu.tar.gz.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set package arch
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo "PKG_ARCH=amd64" >> "$GITHUB_ENV"
          echo "RPM_TARGET=x86_64" >> "$GITHUB_ENV"

      - name: Install rpmbuild
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build .deb
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          version_no_v="${RELEASE_VERSION#v}"
          pkg_root="dist/debian/${PKG_ARCH}"
          mkdir -p "$pkg_root/usr/bin"
          install -m 0755 target/x86_64-unknown-linux-gnu/release/piratebay "$pkg_root/usr/bin/piratebay"
          sed -i "s/^Version: .*/Version: ${version_no_v}/" "$pkg_root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$pkg_root" "dist/piratebay_${version_no_v}_${PKG_ARCH}.deb"

      - name: Build .rpm
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          version_no_v="${RELEASE_VERSION#v}"
          src_root="dist/rpm/${PKG_ARCH}"
          mkdir -p "${src_root}/usr/bin"
          install -m 0755 target/x86_64-unknown-linux-gnu/release/piratebay "${src_root}/usr/bin/piratebay"
          sed -i "s/^Version:        .*/Version:        ${version_no_v}/" "${src_root}/piratebay.spec"

          rpm_top="$(pwd)/dist/rpmbuild"
          mkdir -p "${rpm_top}"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp -r "${src_root}" "${rpm_top}/SOURCES/${PKG_ARCH}"
          rpmbuild --define "_topdir ${rpm_top}" \
                   --define "_sourcedir ${rpm_top}/SOURCES" \
                   --target "${RPM_TARGET}" \
                   -bb "${src_root}/piratebay.spec"
          find "${rpm_top}/RPMS" -name '*.rpm' -exec mv {} dist/ \;

      - name: Checksum packages
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *.deb *.rpm; do
            [ -e "$f" ] || continue
            shasum -a 512 "$f" > "$f.sha512"
          done
          ls -lh

      - name: Upload package assets
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            dist/*.deb
            dist/*.deb.sha512
            dist/*.rpm
            dist/*.rpm.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Gemfury secrets
        id: gemfury
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          if [ -n "$FURY_TOKEN" ] && [ -n "$FURY_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Gemfury secrets not set; skipping push"
          fi

      - name: Push .deb and .rpm to Gemfury
        if: matrix.target == 'x86_64-unknown-linux-musl' && steps.gemfury.outputs.available == 'true'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in dist/*.deb dist/*.rpm; do
            echo "Pushing $pkg to Gemfury (${FURY_ACCOUNT})"
            curl -fsS -F package=@"${pkg}" \
              "https://${FURY_TOKEN}@push.fury.io/${FURY_ACCOUNT}/"
            echo
          done

  release-linux-aarch64:
    name: release aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Running cargo build
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu
      - name: Set env
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "RELEASE_VERSION=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          fi
      - name: Packaging final binary
        shell: bash
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar czvf piratebay_${{ env.RELEASE_VERSION }}_aarch64-unknown-linux-gnu.tar.gz piratebay
          shasum -a 512 piratebay_${{ env.RELEASE_VERSION }}_aarch64-unknown-linux-gnu.tar.gz > piratebay_${{ env.RELEASE_VERSION }}_aarch64-unknown-linux-gnu.tar.gz.sha512
      - name: Releasing assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            target/aarch64-unknown-linux-gnu/release/piratebay_${{ env.RELEASE_VERSION }}_aarch64-unknown-linux-gnu.tar.gz
            target/aarch64-unknown-linux-gnu/release/piratebay_${{ env.RELEASE_VERSION }}_aarch64-unknown-linux-gnu.tar.gz.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set package arch
        run: echo "PKG_ARCH=arm64" >> "$GITHUB_ENV"

      - name: Build .deb
        shell: bash
        run: |
          set -euo pipefail
          version_no_v="${RELEASE_VERSION#v}"
          pkg_root="dist/debian/${PKG_ARCH}"
          mkdir -p "$pkg_root/usr/bin"
          install -m 0755 target/aarch64-unknown-linux-gnu/release/piratebay "$pkg_root/usr/bin/piratebay"
          sed -i "s/^Version: .*/Version: ${version_no_v}/" "$pkg_root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$pkg_root" "dist/piratebay_${version_no_v}_${PKG_ARCH}.deb"

      - name: Checksum packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *.deb; do
            [ -e "$f" ] || continue
            shasum -a 512 "$f" > "$f.sha512"
          done

      - name: Upload package assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            dist/*.deb
            dist/*.deb.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Gemfury secrets
        id: gemfury
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          if [ -n "$FURY_TOKEN" ] && [ -n "$FURY_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Gemfury secrets not set; skipping push"
          fi

      - name: Push .deb to Gemfury
        if: steps.gemfury.outputs.available == 'true'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in dist/*.deb; do
            echo "Pushing $pkg to Gemfury (${FURY_ACCOUNT})"
            curl -fsS -F package=@"${pkg}" \
              "https://${FURY_TOKEN}@push.fury.io/${FURY_ACCOUNT}/"
            echo
          done
