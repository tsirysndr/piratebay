name: release-bsd

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload assets for (e.g. v0.3.0). The tag and matching GitHub release must already exist."
        required: true
        type: string

jobs:
  build-bsd:
    name: release ${{ matrix.triple }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            os_version: "14.3"
            triple: x86_64-unknown-freebsd
            install_rust: sudo env ASSUME_ALWAYS_YES=YES pkg install -y rust
          - os: netbsd
            os_version: "10.1"
            triple: x86_64-unknown-netbsd
            install_rust: sudo pkgin -y update && sudo pkgin -y install rust
          - os: openbsd
            os_version: "7.9"
            triple: x86_64-unknown-openbsd
            install_rust: sudo pkg_add rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set env
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "RELEASE_VERSION=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          fi

      - name: Start ${{ matrix.os }} VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.os_version }}
          architecture: x86-64
          shell: bash
          memory: 8G
          cpu_count: 4

      - name: Build in VM
        shell: cpa.sh {0}
        run: |
          set -euo pipefail
          ${{ matrix.install_rust }}
          # OpenBSD's default datasize ulimit is too low for rustc.
          ulimit -d "$(ulimit -H -d)" 2>/dev/null || true
          # Keep target/ out of the workspace so it isn't synced back.
          export CARGO_TARGET_DIR="$HOME/build"
          cargo build --release --locked
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/release/piratebay" dist/piratebay

      - name: Packaging final binary
        shell: bash
        run: |
          set -euo pipefail
          archive="piratebay_${RELEASE_VERSION}_${{ matrix.triple }}.tar.gz"
          tar -C dist -czvf "$archive" piratebay
          shasum -a 512 "$archive" > "$archive.sha512"

      - name: Releasing assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            piratebay_${{ env.RELEASE_VERSION }}_${{ matrix.triple }}.tar.gz
            piratebay_${{ env.RELEASE_VERSION }}_${{ matrix.triple }}.tar.gz.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
